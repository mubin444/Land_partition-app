name: Build Kivy Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. Checkout project
      # =========================================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"


      # =========================================================
      # 3. Setup Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # =========================================================
      # 4. Install Ubuntu dependencies
      # =========================================================
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            make \
            gcc \
            g++ \
            ccache \
            patch \
            lbzip2 \
            ant \
            openjdk-17-jdk


      # =========================================================
      # 5. Check Java
      # =========================================================
      - name: Check Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version


      # =========================================================
      # 6. Install Buildozer
      # =========================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install "Cython==0.29.33"
          pip install buildozer
          pip install pillow

          echo "===== Buildozer Version ====="
          buildozer --version


      # =========================================================
      # 7. Check buildozer.spec
      # =========================================================
      - name: Check Buildozer Spec
        run: |
          echo "===== Original buildozer.spec ====="
          cat buildozer.spec


      # =========================================================
      # 8. Add source.dir temporarily
      #
      # IMPORTANT:
      # This changes buildozer.spec ONLY inside GitHub runner.
      # It does NOT modify your GitHub repository permanently.
      # =========================================================
      - name: Fix Buildozer Spec Temporarily
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")

          if not path.exists():
              raise SystemExit("ERROR: buildozer.spec not found!")

          text = path.read_text()

          # Remove existing source.dir lines
          lines = [
              line for line in text.splitlines()
              if not line.strip().startswith("source.dir")
          ]

          # Find [app]
          app_index = None

          for i, line in enumerate(lines):
              if line.strip() == "[app]":
                  app_index = i
                  break

          if app_index is None:
              raise SystemExit("ERROR: [app] section not found!")

          # Find next section
          insert_index = len(lines)

          for i in range(app_index + 1, len(lines)):
              line = lines[i].strip()

              if line.startswith("[") and line.endswith("]"):
                  insert_index = i
                  break

          # Add source.dir
          lines.insert(insert_index, "source.dir = .")

          path.write_text("\n".join(lines) + "\n")

          print("source.dir = . added successfully.")
          PY

          echo ""
          echo "===== CHECK source.dir ====="

          grep -n \
            -E "^\[app\]|^source.dir|^title|^package.name|^package.domain|^requirements|^android.api|^android.minapi|^android.ndk" \
            buildozer.spec

          echo ""
          echo "===== FINAL buildozer.spec ====="

          cat buildozer.spec


      # =========================================================
      # 9. Create Android SDK directory
      # =========================================================
      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"


      # =========================================================
      # 10. Install Android Command Line Tools
      # =========================================================
      - name: Install Android Command Line Tools
        run: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          cd /tmp

          echo "Downloading Android Command Line Tools..."

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O android-commandline-tools.zip

          echo "Download complete."

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          unzip -q \
            android-commandline-tools.zip \
            -d "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          # Fix nested directory
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools" ]; then

            mv \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools/"* \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

            rm -rf \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools"

          fi

          echo ""
          echo "===== Command Line Tools ====="

          find \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest" \
            -maxdepth 2 \
            -type f | head -50

          echo ""
          echo "===== sdkmanager ====="

          ls -lh \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo ""
          echo "===== sdkmanager version ====="

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version


      # =========================================================
      # 11. Install Android SDK packages
      # =========================================================
      - name: Install Android SDK Packages
        run: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          echo ""
          echo "===== Accept Android SDK licenses ====="

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

          echo ""
          echo "===== Install SDK packages ====="

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-31" \
            "build-tools;35.0.0"

          echo ""
          echo "===== Accept licenses again ====="

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true


      # =========================================================
      # 12. Verify Build Tools + AIDL
      # =========================================================
      - name: Verify Android Build Tools
        run: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== SDK ====="

          ls -lah "$ANDROID_SDK_ROOT"

          echo ""
          echo "===== Build Tools ====="

          ls -lah "$ANDROID_SDK_ROOT/build-tools"

          echo ""
          echo "===== Build Tools 35 ====="

          ls -lah \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo ""
          echo "===== AIDL ====="

          if [ -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl" ]; then
            echo "AIDL FOUND"
            ls -lh \
              "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"
          else
            echo "ERROR: AIDL NOT FOUND"
            exit 1
          fi


      # =========================================================
      # 13. Configure Android environment
      # =========================================================
      - name: Configure Android Environment
        run: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"


      # =========================================================
      # 14. Verify tools
      # =========================================================
      - name: Verify Android Tools
        run: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== Java ====="
          java -version

          echo ""
          echo "===== SDKMANAGER ====="
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

          echo ""
          echo "===== ADB ====="
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

          echo ""
          echo "===== AAPT ====="
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" version

          echo ""
          echo "===== AIDL ====="
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl" --version


      # =========================================================
      # 15. Build APK
      # =========================================================
      - name: Build APK with Buildozer
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "=========================================="
          echo "STARTING ANDROID APK BUILD"
          echo "=========================================="

          echo ""
          echo "===== Current directory ====="
          pwd

          echo ""
          echo "===== Project files ====="
          ls -lah

          echo ""
          echo "===== Buildozer spec ====="
          grep -n \
            -E "^\[app\]|^source.dir|^title|^package.name|^package.domain|^requirements|^android.api|^android.minapi|^android.ndk" \
            buildozer.spec

          echo ""
          echo "===== Buildozer ====="
          buildozer --version

          echo ""
          echo "===== BUILD START ====="

          buildozer -v android debug


      # =========================================================
      # 16. Find generated APK
      # =========================================================
      - name: Find APK
        if: success()
        run: |
          echo "===== Searching for APK ====="

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "===== bin directory ====="

          if [ -d "bin" ]; then
            ls -lah bin
          else
            echo "bin directory not found!"
          fi


      # =========================================================
      # 17. Upload APK
      # =========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Land-Calculator-APK
          path: |
            bin/*.apk
          if-no-files-found: error
